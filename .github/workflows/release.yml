name: Release

# Safety net for dist/bubble-card.zip, which is where HACS downloads the card
# from since hacs.json sets "zip_release": true. Without this asset the HACS
# Action reports "Repository structure is not compliant".
#
# The zip is normally attached by hand in the release form, before publishing,
# so that it is already there the second the release goes public. This job only
# steps in when that was forgotten. It never touches a release that already has
# the asset, because re-uploading deletes it for a few seconds and that is
# exactly when HACS clients are hitting it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to (re)package"
        required: true

jobs:
  zip:
    name: Attach bubble-card.zip
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Clooos'
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # A manual run is an explicit "repackage this tag", so it always proceeds.
      - name: Look for an asset that is already attached
        id: check
        run: |
          if [ "${{ github.event_name }}" = "release" ] &&
             gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'bubble-card.zip'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "bubble-card.zip is already attached to $TAG, leaving it untouched."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # The committed dist is what HACS served before the switch to zip_release,
      # so packaging it as is keeps the delivered bundle identical.
      - name: Package dist
        if: steps.check.outputs.skip != 'true'
        run: |
          cd dist
          zip -qr ../bubble-card.zip . -x '*.zip'
          unzip -l ../bubble-card.zip

      - name: Upload to the release
        if: steps.check.outputs.skip != 'true'
        run: gh release upload "$TAG" bubble-card.zip --clobber

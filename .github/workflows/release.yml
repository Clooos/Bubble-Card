name: Release

# Attaches dist/bubble-card.zip to every published release, which is where HACS
# downloads the card from since hacs.json sets "zip_release": true. Without this
# asset the HACS Action reports "Repository structure is not compliant".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to (re)package"
        required: true

jobs:
  zip:
    name: Attach bubble-card.zip
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Clooos'
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # The committed dist is what HACS served before the switch to zip_release,
      # so packaging it as is keeps the delivered bundle identical.
      - name: Package dist
        run: |
          cd dist
          zip -qr ../bubble-card.zip . -x '*.zip'
          unzip -l ../bubble-card.zip

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" bubble-card.zip --clobber
